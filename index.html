<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kani GAO - Quantitative Finance & Risk Management | CUHK Undergraduate" />
    <meta name="theme-color" content="#0a0f1c" />
    <title>Kani GAO | Quant Finance & AI Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Prevent flash of wrong theme -->
    <script>
      (function () {
        const theme = localStorage.getItem('theme') || 'dark'
        document.documentElement.classList.toggle('dark', theme === 'dark')
      })()
    </script>
  </head>
  <body class="bg-[#f7f9fc] text-[#0b1220] dark:bg-ink dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
